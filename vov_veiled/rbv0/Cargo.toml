[package]
name = "rbv"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
description = "Hierophant — delivery-ceremony conductor for Recipe Bottle (veiled, withheld from delivery)"

# No third-party dependencies by construction. The hierophant sequences proven
# workers as subprocesses (RBSHC "Worker, never authority") and needs only std:
# process, fs, path, time. A veiled release-ceremony conductor pulls in no
# third-party crate — the smaller its own surface, the less there is to trust.
# The one dependency is the estate's std-only floor crate, whose program writers
# arm every file the ceremony means to run.
[dependencies]
bkp = { path = "../../Tools/bkk/bk0/bkp" }
