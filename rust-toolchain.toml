# The repository's channel, answering for every crate that does not pin its own:
# the theurge and the floor crate it links among them.
#
# Stated because it was otherwise left to whatever the station's store happened
# to default to — a channel no file here named, and so one that could differ
# between two clones. The theurge's own cargo doors read the channel from this
# line and state it on every call, so a consumer building what ships builds on
# the channel this repository was proven on.
[toolchain]
channel = "1.90.0"
