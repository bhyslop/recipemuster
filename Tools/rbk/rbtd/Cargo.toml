[package]
name = "rbt"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Theurge — crucible test orchestrator for Recipe Bottle"

[dependencies]
tungstenite = "0.24"
# Clipboard READ capability for the clipboard fixture's round-trip case —
# deliberately test-binary-only: no clipboard-read primitive exists on the
# shipped bash surface (operator ruling 260704).
arboard = "3"

# The floor crate's program writers, for the test cases that write a script and
# run it from a threaded runner — a write left to this process races every
# sibling's fork into ETXTBSY. Test-only: no shipped path writes a program.
[dev-dependencies]
bkp = { path = "../../bkk/bk0/bkp" }
