[package]
name = "but"
version = "0.0.1"
edition = "2021"
description = "The substrate's own self-test - plain rust hurdles that spawn bash and judge it from outside the dying process"
license = "Apache-2.0"

# A LIBRARY AND NO BINARY, and the emptiness of the binary side is the point.
# The substrate is bash; nothing here is a program the estate runs. What this
# crate holds is hurdles and the support they share, so the lib exists to give
# the hurdles a home to import from and cargo a target to hang them on.
#
# THE SUBSTRATE STAYS WHOLE WITH NO RUST TOOLCHAIN PRESENT. This crate stands
# in the kennel kit beside the kennel's own, and the substrate it tests holds no
# Rust at all: nothing under Tools/buk is compiled by cargo, so a station holding
# no toolchain runs every substrate door exactly as before and only this suite is
# out of its reach.
[lib]
name = "but"
path = "src/lib.rs"

# THE COMPOSING SURFACE, AND THE ONLY DEPENDENCY. A hurdle that reaches the temp
# root, composes a repository or spawns a door reaches it through the kennel's
# surface and never through a bare std::env or a git of its own; that surface is
# the only home the lure sheaf admits, so this crate takes the kennel to reach it
# rather than growing a second one.
#
# A REGULAR DEPENDENCY RATHER THAN A DEV ONE, because the support this crate's
# own lib holds is built on that surface, and a dev-dependency is out of scope
# for lib code. Nothing ships either way: this crate builds no binary at all.
[dependencies]
bkk = { path = "../bk0", features = ["lure"] }

# THE ESTATE'S ONE REGIME READER, beside the kennel in its floor crate: a hurdle
# proving the dispatch file reads alike in bash and outside a shell reads it
# with the reader every Rust consumer of that file uses, never a parse of its own.
bkp = { path = "../bk0/bkp" }

# THE SEED-TEMPLATE HURDLE IS A SECOND SUITE, kept out of the substrate's own
# run. It reads the starter kit's templates by path, and the starter kit is a
# kit of its own that a parcel carrying the substrate need not carry; a hurdle
# depending on something its suite's tree does not hold is a second suite with a
# collar of its own (`specs/bkk/BKSCL-Collar.adoc` "The Identity Law"). So the
# target stands out of the default run under cargo's own `test = false`, and its
# collar ships in the starter kit's brood, reaching only a repository that
# carries that kit.
[[test]]
name = "butt-template"
path = "tests/butt_template.rs"
test = false
