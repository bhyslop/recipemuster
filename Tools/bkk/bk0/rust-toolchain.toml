# The kennel's own pin. Its own root and its own lock: the workspace election is
# deferred beyond MVP (BKSNC-Kennelcraft.adoc "Open Elections"), so this
# crate joins nothing and states its channel here.
#
# The leash never INHERITS this pin by discovery — it reads it and STATES it on
# every cargo invocation. The engine-invocation census found rustup reporting
# "(default)" at a repository root because a toolchain file standing at a
# subdirectory is out of scope there, so a build that appeared pinned was in
# fact taking whatever the store's default happened to be. Stating the channel
# is what closes that.
[toolchain]
channel = "1.90.0"
