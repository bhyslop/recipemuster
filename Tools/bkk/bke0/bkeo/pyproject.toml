# THE OPENMM EXEMPLAR — a suite-only python project over a native-library
# closure, which the kennel carries from its first lock to a green suite.
#
# Read it beside its collar, bkeon_suite, in the kit's brood. It declares no
# build system, so uv treats it as a set of dependencies and its suite rather
# than a package: nothing of it is built, and the converge installs only what
# the lock names.

[project]
name = "bkeo"
version = "0.0.1"

# NARROWED TO THE PIN'S MINOR, so the universal lock carries no wheel an
# interpreter of another minor would take.
requires-python = ">=3.12,<3.13"
dependencies = ["openmm"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["bkeo0"]
python_files = ["bkeot_*.py"]
python_functions = ["bkeot_*"]
