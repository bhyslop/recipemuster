# THE DECLARED EXEMPLAR — the hello project's shape, declared for one platform.
#
# Read it beside its two collars, bkeun_app and bkeun_suite, in the kit's brood.
# On a station inside its declaration it converges and runs exactly as the
# hello exemplar does; on any other station every door reports its courses
# unhitched: the derby and the futurity name them and launch nothing, and heel
# and mush refuse naming the declaration. A real package that publishes wheels
# for one platform alone may replace this body later.

[project]
name = "bkeu"
version = "0.0.1"

# NARROWED TO THE PIN'S MINOR, as the hello exemplar is, so the lock records no
# wheel an interpreter outside the pin could take.
requires-python = ">=3.12,<3.13"
dependencies = []

# THE ENTRY POINT THE APP COLLAR NAMES.
[project.scripts]
bkeu = "bkeu0.bkeua_hello:bkeua_main"

# The suite's runner, in the group uv installs by default.
[dependency-groups]
dev = ["pytest"]

# UV'S OWN BACKEND, in the range the pinned uv carries built in.
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bkeu0"
module-root = ""

# THE PLATFORMS THIS PROJECT'S LOCK COVERS, in uv's own key. uv writes them into
# the lock as its supported markers, resolves for them alone, and refuses to
# sync on a station outside them. This file is the one place a platform is
# named: the kennel reads uv's verdict and never the marker.
[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["bkeu0"]
python_files = ["bkeut_*.py"]
python_functions = ["bkeut_*"]
